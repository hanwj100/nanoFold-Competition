run_name: hanwj100_nano_limited
track: limited
seed: 0

submission:
  path: submission.py

data:
  processed_features_dir: /root/nanoFold-Competition/data/processed_features
  processed_labels_dir: /root/nanoFold-Competition/data/processed_labels
  train_manifest: /root/nanoFold-Competition/data/manifests/train.txt
  val_manifest: /root/nanoFold-Competition/data/manifests/val.txt
  crop_size: 256
  msa_depth: 192
  batch_size: 1
  num_workers: 2
  train_crop_mode: random
  val_crop_mode: center
  train_msa_sample_mode: random
  val_msa_sample_mode: top

model:
  d_model: 512
  n_layers: 24
  n_heads: 8
  dropout: 0.1

optim:
  lr: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip_norm: 1.0

train:
  max_steps: 10000
  log_every: 50
  eval_every: 500
  save_every: 500
  grad_accum_steps: 2
  amp: true
